<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sandeep & Mia — Wedding Invitation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="scroll-video-section">
    <div class="video-stage">
      <video
        id="invitationVideo"
        class="invitation-video"
        muted
        playsinline
        webkit-playsinline
        preload="auto"
        disablepictureinpicture
      >
        <source src="video/invitation.mp4" type="video/mp4">
      </video>

      <div class="scroll-hint" id="scrollHint">
        <span>SCROLL</span>
        <span class="arrow">↓</span>
      </div>
    </div>
  </section>

  <section class="couple-section">
    <div class="couple-content">
      <p class="eyebrow reveal">TOGETHER WITH THEIR FAMILIES</p>

      <div class="names reveal">
        <h1>Sandeep</h1>
        <span>&amp;</span>
        <h1>Mia</h1>
      </div>

      <div class="ornament reveal">✦</div>

      <p class="invite-line reveal">
        invite you to celebrate<br>
        their wedding
      </p>

      <p class="date reveal">10 · NOVEMBER · 2026</p>
    </div>
  </section>

  <section class="details-section">
    <div class="details-content">
      <p class="eyebrow">THE WEDDING</p>
      <h2>Join us as we<br>begin forever.</h2>

      <div class="event">
        <p class="event-label">CEREMONY</p>
        <p class="event-date">10 November 2026</p>
        <p class="event-time">10:00 AM</p>
        <p class="event-place">The Grand Palace<br>Kerala</p>
      </div>

      <div class="divider">✦</div>

      <div class="event">
        <p class="event-label">RECEPTION</p>
        <p class="event-date">10 November 2026</p>
        <p class="event-time">6:30 PM</p>
        <p class="event-place">The Grand Palace<br>Kerala</p>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
